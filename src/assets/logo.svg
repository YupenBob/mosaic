<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .p1 { fill: #1d1d1f; }
    .p2 { fill: #4361ee; }
    @media (prefers-color-scheme: dark) {
      .p1 { fill: #f5f5f7; }
      .p2 { fill: #6b86f2; }
    }
  </style>
  <defs>
    <clipPath id="tile">
      <rect x="16" y="16" width="96" height="96" rx="24"/>
    </clipPath>
  </defs>
  <!-- One rounded tile split by a diagonal grout seam: two pieces joined -->
  <g clip-path="url(#tile)">
    <polygon points="16,16 112,16 112,105.64 22.36,16" class="p2" fill="#4361ee"/>
    <polygon points="16,16 16,22.36 105.64,112 112,112 16,112" class="p1" fill="#1d1d1f"/>
  </g>
</svg>
