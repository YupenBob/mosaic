name: Mosaic Media

# Triggered by the Worker's Jobs DO (workflow_dispatch) or manually. Media
# processing never runs from a plain push: it needs R2/Worker credentials and a
# paid runner window.
on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: Media job timeout (10-360 minutes)
        default: '90'
        type: string

permissions:
  contents: read

concurrency:
  group: mosaic-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.MEDIA_TIMEOUT_MINUTES || '90') }}
    # Non-secret configuration only; credentials are scoped to the processing
    # steps below so `npm ci` / ffmpeg never see production secrets.
    env:
      API_TARGET: ${{ vars.API_TARGET }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MIGRATION_GIT_SHA: ${{ vars.MIGRATION_GIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies and media tools
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      - name: Migrate legacy manifests
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/media/migrate.mjs
      - name: Process queued media
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run media:process
      - name: Clean unreferenced media versions
        if: success()
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/media/cleanup.mjs
