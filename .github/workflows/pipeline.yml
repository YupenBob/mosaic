name: Mosaic Site

# Owns production content deploys: a main push, or a workflow_dispatch from the
# Worker/admin. Non-main branches and PRs are covered by verify.yml.
on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'scripts/**', 'shared/**', 'functions/**', 'mosaic.config.json', 'package*.json', '.github/workflows/pipeline.yml', '.build-trigger']
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: Site job timeout (10-360 minutes)
        default: '90'
        type: string

permissions:
  contents: read

concurrency:
  group: mosaic-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.SITE_TIMEOUT_MINUTES || '90') }}
    # Deployment target metadata: no required reviewers, so deploys stay
    # automated while every Pages release is attributable to an environment.
    environment: production
    # Non-secret configuration only. Secrets are scoped to the individual steps
    # that actually call an external API (snapshot, deploy, cache upload, ack).
    env:
      API_TARGET: ${{ vars.API_TARGET }}
      SITE_BRANCH: ${{ vars.SITE_BRANCH }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix worker
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      - name: Acquire published media snapshot
        if: github.ref_name == env.SITE_BRANCH
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: node scripts/site/snapshot.mjs begin
      - name: Generate site
        run: npm run build
      - name: Offline checks
        run: npm run check && npm run lint && npm run format:check
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Browser regression
        run: npm run test:e2e:local
      - name: Deploy progress
        if: github.ref_name == env.SITE_BRANCH
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: node scripts/site/snapshot.mjs progress deploy
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.ref_name == env.SITE_BRANCH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/deploy-pages.mjs
      - name: Publish site data cache
        id: cache
        if: github.ref_name == env.SITE_BRANCH
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/site/upload-data.mjs
      - name: Acknowledge deployment
        if: always() && github.ref_name == env.SITE_BRANCH
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          JOB_STATUS: ${{ steps.deploy.outcome }}
          CACHE_STATUS: ${{ steps.cache.outcome }}
        run: |
          if [ -f .mosaic/build-lease.json ]; then node scripts/site/snapshot.mjs done "$JOB_STATUS"; fi
