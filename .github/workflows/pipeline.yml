name: Mosaic Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mosaic-pipeline
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  R2_BUCKET: mosaic-media

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Media transcoding of large source videos dominates runtime (a ~900MB 4K
    # drone clip takes ~26min for 5 tiers); give the job real headroom.
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }

      - name: Install tools
        run: |
          sudo apt-get update -qq
          # ubuntu-latest ships ffmpeg; only install what's missing
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          command -v rclone >/dev/null || sudo apt-get install -y -qq rclone
          command -v exiftool >/dev/null || sudo apt-get install -y -qq libimage-exiftool-perl

      - name: Install deps
        run: npm ci

      - name: Validate config + frontmatter
        run: npm run validate

      - name: Restore media checksums cache
        id: checksums-cache
        uses: actions/cache@v4
        with:
          path: dist/.media-checksums.json
          key: media-checksums-${{ github.sha }}
          restore-keys: |
            media-checksums-

      # ── 1. Sync originals from R2 ──
      - name: Sync media from R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          mkdir -p ~/.config/rclone
          echo '[r2]' > ~/.config/rclone/rclone.conf
          echo 'type = s3' >> ~/.config/rclone/rclone.conf
          echo 'provider = Cloudflare' >> ~/.config/rclone/rclone.conf
          echo "access_key_id = $R2_ACCESS_KEY" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = $R2_SECRET_KEY" >> ~/.config/rclone/rclone.conf
          echo "endpoint = $R2_ENDPOINT" >> ~/.config/rclone/rclone.conf
          rclone copy r2:${R2_BUCKET}/originals/ content/posts/ --transfers 4 -v
          echo "Synced from R2"

      # ── 1b. Strip EXIF from originals (privacy: GPS etc.) ──
      - name: Strip EXIF from originals
        run: |
          # Tolerate files whose extension doesn't match their content
          # (exiftool refuses them; skip + log instead of failing the build)
          find content/posts -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.tiff' -o -iname '*.tif' \) -exec sh -c 'exiftool -all= -overwrite_original "$1" 2>/dev/null || echo "skip(not-stripped): $1"' _ {} \;
          echo "EXIF strip complete (skips above are non-fatal)"

      # 鈹€鈹€ Build progress reporter: upload dist/build-progress.json to R2 every 5s
      # so the admin panel can show which media file is being processed.
      - name: Start build progress reporter
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          mkdir -p dist
          node scripts/build-progress.mjs media

      - name: Compress media
        env:
          NODE_ENV: production
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/compress.js

      - name: Save media checksums cache
        uses: actions/cache/save@v4
        with:
          path: dist/.media-checksums.json
          # Unique per run so concurrent same-SHA runs (push + manual dispatch)
          # don't collide on the same key and drop the cache (which would force
          # every build to re-transcode all media). Restore still matches via
          # the `media-checksums-` prefix in restore-keys.
          key: media-checksums-${{ github.sha }}-${{ github.run_id }}

      - name: Progress — generate site
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/build-progress.mjs generate || true

      # ── 3. Generate site ──
      - name: Generate site
        env:
          NODE_ENV: production
        run: node scripts/generate.js

      - name: Progress — tests
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/build-progress.mjs test || true

      # ── 3b. Tests ──
      - name: Install worker deps
        run: cd worker && npm ci && cd ..

      - name: Run checks (syntax + smoke)
        run: npm run check

      - name: Lint + format check
        run: |
          npm run lint
          npm run format:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E (local static preview)
        run: |
          npx serve dist -l 3000 >/dev/null 2>&1 &
          SERVER_PID=$!
          sleep 3
          SITE=http://127.0.0.1:3000 ADMIN=skip npx playwright test tests/frontend.spec.js --grep-invert "Worker health|mobile viewport|admin login" --reporter=list
          EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT

      - name: Progress — upload
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/build-progress.mjs upload || true

      # ── 4. Upload processed to R2 ──
      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          mkdir -p ~/.config/rclone
          echo '[r2]' > ~/.config/rclone/rclone.conf
          echo 'type = s3' >> ~/.config/rclone/rclone.conf
          echo 'provider = Cloudflare' >> ~/.config/rclone/rclone.conf
          echo "access_key_id = $R2_ACCESS_KEY" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = $R2_SECRET_KEY" >> ~/.config/rclone/rclone.conf
          echo "endpoint = $R2_ENDPOINT" >> ~/.config/rclone/rclone.conf
          node scripts/upload.js

      # ── 4a. Upload video HLS via SDK (Cache-Control: no-store + correct types) ──
      - name: Upload video media
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIDEO_CACHE_CONTROL: 'public, max-age=31536000'
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          node worker/scripts/upload-videos.mjs

      # ── 4b. Sync stripped originals back to R2 (EXIF-free) ──
      - name: Sync stripped originals back
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          mkdir -p ~/.config/rclone
          echo '[r2]' > ~/.config/rclone/rclone.conf
          echo 'type = s3' >> ~/.config/rclone/rclone.conf
          echo 'provider = Cloudflare' >> ~/.config/rclone/rclone.conf
          echo "access_key_id = $R2_ACCESS_KEY" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = $R2_SECRET_KEY" >> ~/.config/rclone/rclone.conf
          echo "endpoint = $R2_ENDPOINT" >> ~/.config/rclone/rclone.conf
          rclone copy content/posts/ r2:${R2_BUCKET}/originals/ \
            --include "*/photos/**" --include "*/videos/**" --include "*/music/**" --include "*/cover.*" \
            --checksum --transfers 4
          echo "Originals synced back (EXIF stripped)"

      - name: Progress — deploy
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/build-progress.mjs deploy || true

      # ── 4c. Minify frontend assets (after all tests so checks see source assets) ──
      - name: Minify frontend assets
        run: node scripts/minify.mjs

      # ── 5. Strip media from dist (served from R2) ──
      - name: Strip media from dist
        run: |
          echo "Removing media files from dist/ (served from R2)..."
          find dist -type d -name media -exec rm -rf {} + 2>/dev/null || true
          echo "Media stripped — Pages only needs HTML/CSS/JS/data"

      # ── 6. Copy Functions + Deploy to CF Pages ──
      - name: Copy Functions to dist
        run: |
          if [ -d "functions" ]; then
            cp -r functions dist/
            echo "Functions copied to dist/"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name mosaic --branch main --commit-dirty=true

      - name: Finish build progress
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          node scripts/build-progress.mjs done || true
