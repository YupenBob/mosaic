name: Mosaic Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  R2_BUCKET: mosaic-media

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rclone

      - name: Install deps
        run: npm ci

      # ── 1. Sync originals from R2 ──
      - name: Sync media from R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          mkdir -p ~/.config/rclone
          echo '[r2]' > ~/.config/rclone/rclone.conf
          echo 'type = s3' >> ~/.config/rclone/rclone.conf
          echo 'provider = Cloudflare' >> ~/.config/rclone/rclone.conf
          echo "access_key_id = $R2_ACCESS_KEY" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = $R2_SECRET_KEY" >> ~/.config/rclone/rclone.conf
          echo "endpoint = $R2_ENDPOINT" >> ~/.config/rclone/rclone.conf
          rclone copy r2:${R2_BUCKET}/originals/ content/posts/ --transfers 4 -v
          echo "Synced from R2"

      # ── 2. Compress media ──
      - name: Compress media
        env:
          NODE_ENV: production
        run: node scripts/compress.js

      # ── 3. Generate site ──
      - name: Generate site
        env:
          NODE_ENV: production
        run: node scripts/generate.js

      # ── 4. Upload processed to R2 ──
      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no R2 creds"; exit 0; fi
          mkdir -p ~/.config/rclone
          echo '[r2]' > ~/.config/rclone/rclone.conf
          echo 'type = s3' >> ~/.config/rclone/rclone.conf
          echo 'provider = Cloudflare' >> ~/.config/rclone/rclone.conf
          echo "access_key_id = $R2_ACCESS_KEY" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = $R2_SECRET_KEY" >> ~/.config/rclone/rclone.conf
          echo "endpoint = $R2_ENDPOINT" >> ~/.config/rclone/rclone.conf
          node scripts/upload.js

      # ── 5. Deploy to CF Pages ──
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mosaic
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
