name: Mosaic Media v2 Migration

# Dry-run planning and the one-shot apply. The apply path runs in the
# `production` environment, re-runs the offline suite before touching data and
# rewrites every post frontmatter in ONE commit (never a commit per post).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or apply
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      confirm:
        description: Type media-v2 to apply
        required: false
        default: ''
        type: string
  push:
    paths:
      - .github/migrate-v2/plan
      - .github/migrate-v2/apply

permissions:
  contents: write
  actions: write

concurrency:
  group: mosaic-media-v2-migration
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      confirm: ${{ steps.mode.outputs.confirm }}
    # Non-secret configuration only; the Worker signature secret is scoped to
    # the planning step that reads the live media state.
    env:
      API_TARGET: ${{ vars.API_TARGET }}
      SITE_BRANCH: ${{ vars.SITE_BRANCH || 'main' }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      - name: Resolve migration mode
        id: mode
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="$DISPATCH_MODE"
            CONFIRM="$DISPATCH_CONFIRM"
          elif [ -f .github/migrate-v2/apply ]; then
            MODE=apply
            CONFIRM="$(tr -d '[:space:]' < .github/migrate-v2/apply)"
          else
            MODE=dry-run
            CONFIRM=""
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
      - name: Dry run plan
        if: steps.mode.outputs.mode == 'dry-run'
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/media/migrate-v2.mjs --write-plan
      - name: Commit dry-run plan
        if: steps.mode.outputs.mode == 'dry-run' && github.event_name == 'push'
        run: |
          mkdir -p docs
          cp .mosaic/media-v2-plan.json docs/media-v2-plan.json
          npx prettier --write docs/media-v2-plan.json
          git config user.name "mosaic-migration[bot]"
          git config user.email "mosaic-migration@users.noreply.github.com"
          git add docs/media-v2-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(migration): record Media v2 plan"
          git push
      - name: Upload migration plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-v2-plan
          path: .mosaic/media-v2-plan.json
          if-no-files-found: ignore

  apply:
    needs: plan
    if: needs.plan.outputs.mode == 'apply'
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment: production
    env:
      API_TARGET: ${{ vars.API_TARGET }}
      GITHUB_REPO: ${{ github.repository }}
      SITE_BRANCH: ${{ vars.SITE_BRANCH || 'main' }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix worker
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      # Never migrate on top of a broken build: the same offline suite the
      # pipeline uses must pass before any R2 object or commit is written.
      - name: Offline checks
        run: npm run check
      - name: Apply migration
        env:
          MIGRATION_CONFIRM: media-v2
          CONFIRM: ${{ needs.plan.outputs.confirm }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$CONFIRM" != "media-v2" ]; then
            echo "::error::Set confirm=media-v2 to apply the migration"
            exit 1
          fi
          node scripts/media/migrate-v2.mjs --apply
      - name: Trigger site build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/pipeline.yml/dispatches" \
            -d "{\"ref\":\"$SITE_BRANCH\"}"
