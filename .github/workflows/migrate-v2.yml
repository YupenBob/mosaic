name: Mosaic Media v2 Migration
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or apply
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      confirm:
        description: Type media-v2 to apply
        required: false
        default: ''
        type: string
  push:
    paths:
      - .github/migrate-v2/plan
      - .github/migrate-v2/apply
concurrency:
  group: mosaic-media-v2-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      API_TARGET: ${{ vars.API_TARGET }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      SITE_BRANCH: ${{ vars.SITE_BRANCH || 'main' }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      - name: Resolve migration mode
        id: mode
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="$DISPATCH_MODE"
            CONFIRM="$DISPATCH_CONFIRM"
          elif [ -f .github/migrate-v2/apply ]; then
            MODE=apply
            CONFIRM="$(tr -d '[:space:]' < .github/migrate-v2/apply)"
          else
            MODE=dry-run
            CONFIRM=""
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
      - name: Dry run plan
        if: steps.mode.outputs.mode == 'dry-run'
        run: node scripts/media/migrate-v2.mjs --write-plan
      - name: Commit dry-run plan
        if: steps.mode.outputs.mode == 'dry-run' && github.event_name == 'push'
        run: |
          mkdir -p docs
          cp .mosaic/media-v2-plan.json docs/media-v2-plan.json
          npx prettier --write docs/media-v2-plan.json
          git config user.name "mosaic-migration[bot]"
          git config user.email "mosaic-migration@users.noreply.github.com"
          git add docs/media-v2-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(migration): record Media v2 plan"
          git push
      - name: Apply migration
        if: steps.mode.outputs.mode == 'apply'
        env:
          MIGRATION_CONFIRM: media-v2
          CONFIRM: ${{ steps.mode.outputs.confirm }}
        run: |
          if [ "$CONFIRM" != "media-v2" ]; then
            echo "::error::Set confirm=media-v2 to apply the migration"
            exit 1
          fi
          node scripts/media/migrate-v2.mjs --apply
      - name: Trigger site build
        if: steps.mode.outputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/pipeline.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: Upload migration plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-v2-plan
          path: .mosaic/media-v2-plan.json
          if-no-files-found: ignore
