name: Media Cleanup

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug to clean (leave empty for orphaned media scan)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (list only, no delete)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  R2_BUCKET: mosaic-media

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
        [r2]
        type = s3
        provider = Cloudflare
        access_key_id = ${{ secrets.R2_ACCESS_KEY }}
        secret_access_key = ${{ secrets.R2_SECRET_KEY }}
        endpoint = ${{ secrets.R2_ENDPOINT }}
        acl = private
        EOF

      - name: List orphaned media
        run: |
          echo "=== Scanning for orphaned media files ==="
          # Get all slugs from content/
          slugs=$(find content/posts -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | sort)
          echo "Content slugs:"
          echo "$slugs"

          # List all slugs in R2 originals
          echo ""
          echo "=== R2 originals directories ==="
          rclone lsd r2:${R2_BUCKET}/originals/

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — no files will be deleted"
          else
            echo "Cleaning orphaned files..."
            # Delete processed media for non-existent slugs
            rclone lsd r2:${R2_BUCKET}/processed/ | while read -r line; do
              dir=$(echo "$line" | awk '{print $NF}')
              if ! echo "$slugs" | grep -q "^${dir}$"; then
                echo "Deleting orphaned processed media: $dir"
                rclone purge "r2:${R2_BUCKET}/processed/${dir}" || true
              fi
            done
          fi
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
