name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Sync media from R2
        run: |
          if [ -n "$R2_ACCESS_KEY" ]; then
            rclone copy r2:mosaic-media/content/posts/ content/posts/ --include "videos/**" --transfers 4
            echo "Media synced from R2"
          else
            echo "R2 not configured, using local media only"
          fi
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          USE_PAGES_PROXY: true

      - name: Strip large MP4 files (keep HLS ts/m3u8)
        run: |
          find dist -name "*.mp4" -size +25M -delete
          echo "Removed large MP4s, kept HLS segments"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mosaic
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
