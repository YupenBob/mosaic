name: Mosaic Maintenance

# Weekly housekeeping of the R2 bucket plus the manual dry-run entry point.
# Scheduled runs apply; manual dispatches default to --dry-run so an operator
# can inspect the plan first (pass apply=true to execute).
on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply destructive cleanup (default: dry-run)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: mosaic-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # Scheduled runs are unattended and should clean up; manual runs start safe.
    env:
      MOSAIC_APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply || 'false' }}
      API_TARGET: ${{ vars.API_TARGET }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      - name: R2 lifecycle rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/r2-lifecycle.mjs
      - name: Garbage-collect manifest snapshots
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/gc-manifests.mjs
      - name: Prune expired previews
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/prune-previews.mjs
      - name: Prune abandoned drafts
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/prune-drafts.mjs
