name: Mosaic Infrastructure

# Worker/admin infrastructure is production-only: a main push touching the
# runtime surface, or a manual dispatch. Feature branches are covered by
# verify.yml instead of redeploying the edge.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'cloud-admin/**'
      - 'shared/**'
      - 'scripts/lib/published-assets.mjs'
      - 'scripts/lib/context.mjs'
      - 'scripts/ops/**'
      - 'scripts/stage-admin.mjs'
      - 'scripts/deployment-env.mjs'
      - 'scripts/configure-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosaic-infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infrastructure:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: production
    # Non-secret configuration only; secrets live on the external-call steps.
    env:
      SITE_BRANCH: ${{ vars.SITE_BRANCH }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      API_TARGET: ${{ vars.API_TARGET }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix worker
      - name: Generate deployment configuration
        run: node scripts/deployment-env.mjs --worker-config
      - name: Offline validation
        run: |
          npm run check && npm run lint && npm run format:check
          npx playwright install --with-deps chromium
          npm run test:admin:local
          node scripts/stage-admin.mjs
          npm exec --prefix worker -- wrangler deploy --config .mosaic/worker.json --dry-run
      - name: Deploy Worker and media coordinator
        if: github.ref_name == env.SITE_BRANCH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          test -n "$PIPELINE_SECRET"
          npm exec --prefix worker -- wrangler deploy --config .mosaic/worker.json
          printf '%s' "$PIPELINE_SECRET" | npm exec --prefix worker -- wrangler secret put PIPELINE_SECRET --config .mosaic/worker.json
      - name: Deploy admin
        if: github.ref_name == env.SITE_BRANCH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/configure-pages.mjs
          npm exec --prefix worker -- wrangler pages deploy .mosaic/admin-dist --project-name "$ADMIN_PROJECT" --branch "$SITE_BRANCH"
      - name: Secure media domain (WAF allowlist)
        if: github.ref_name == env.SITE_BRANCH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/secure-media-domain.mjs
