name: Mosaic Build & Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: mosaic-build
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  R2_BUCKET: mosaic-media

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: Install dependencies
        run: npm ci

      # ── 2. Sync media from R2 ───────────────
      - name: Sync media from R2
        run: |
          if [ -n "$R2_ACCESS_KEY" ]; then
            mkdir -p ~/.config/rclone
            printf '[r2]\ntype = s3\nprovider = Cloudflare\naccess_key_id = %s\nsecret_access_key = %s\nendpoint = %s\nacl = private\n' \
              "$R2_ACCESS_KEY" "$R2_SECRET_KEY" "$R2_ENDPOINT" > ~/.config/rclone/rclone.conf
            # Pull originals for processing
            rclone copy r2:${R2_BUCKET}/originals/ content/posts/ \
              --include "photos/**" --include "videos/**" --include "music/**" \
              --include "cover.*" \
              --transfers 4 --verbose
            echo "Media synced from R2"
          else
            echo "R2 not configured, using local media only"
          fi
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # ── 3. Compress images ──────────────────
      - name: Compress images
        run: node scripts/compress-images.js
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # ── 4. Compress videos ──────────────────
      - name: Compress videos
        run: node scripts/compress-videos.js
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # ── 5. Extract music metadata ───────────
      - name: Extract music metadata
        run: node scripts/extract-music-meta.js
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # ── 6. Generate site ────────────────────
      - name: Generate static site
        run: npm run build
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          USE_PAGES_PROXY: ${{ vars.USE_PAGES_PROXY || 'true' }}
          NODE_ENV: production

      # ── 6b. Rewrite media URLs in HTML to R2/Worker ──
      - name: Rewrite media URLs to R2/Worker
        run: node scripts/rewrite-media-urls.js
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          USE_PAGES_PROXY: ${{ vars.USE_PAGES_PROXY || 'true' }}

      # ── 7. Upload processed media to R2 ──
      - name: Upload processed media to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: mosaic-media
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "Skip - no creds"; exit 0; fi
          mkdir -p ~/.config/rclone
          echo '[r2]' > ~/.config/rclone/rclone.conf
          echo 'type = s3' >> ~/.config/rclone/rclone.conf
          echo 'provider = Cloudflare' >> ~/.config/rclone/rclone.conf
          echo "access_key_id = $R2_ACCESS_KEY" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = $R2_SECRET_KEY" >> ~/.config/rclone/rclone.conf
          echo "endpoint = $R2_ENDPOINT" >> ~/.config/rclone/rclone.conf
          echo 'acl = private' >> ~/.config/rclone/rclone.conf
          echo "rclone configured"
          for dir in dist/posts/*/; do
            slug=$(basename "$dir")
            mediaDir="${dir}media"
            [ -d "$mediaDir" ] || continue
            if [ -d "${mediaDir}/photos" ]; then
              echo "  ${slug}/photos ($(ls ${mediaDir}/photos | wc -l) files)"
              rclone copy "${mediaDir}/photos" "r2:${R2_BUCKET}/processed/${slug}/photos/" \
                --transfers 4 --retries 3 --timeout 60s --low-level-retries 3 -v --ignore-existing 2>&1 || echo "WARN: photos upload had errors"
            fi
            if [ -d "${mediaDir}/videos" ]; then
              echo "  ${slug}/videos ($(ls ${mediaDir}/videos | wc -l) files)"
              rclone copy "${mediaDir}/videos" "r2:${R2_BUCKET}/processed/${slug}/videos/" \
                --transfers 2 --retries 5 --timeout 120s --low-level-retries 5 -v --ignore-existing 2>&1 || echo "WARN: videos upload had errors"
            fi
            rclone copy "${mediaDir}" "r2:${R2_BUCKET}/processed/${slug}/covers/" \
              --include "cover-*" --transfers 4 --retries 3 --timeout 60s -v --ignore-existing 2>&1 || true
          done
          echo "Upload complete"
          echo "Files uploaded:"
          for dir in dist/posts/*/media/*/; do
            if [ -d "$dir" ]; then
              slug=$(echo $dir | cut -d/ -f2,4)
              count=$(ls "$dir" | wc -l)
              echo "  dist/posts/$slug: $count files"
            fi
          done

      # ── 8. Strip media from dist (now served from R2) ──
      - name: Strip media from dist
        run: |
          if [ -z "$WORKER_API_BASE" ] && [ -z "$R2_PUBLIC_URL" ]; then echo "No proxy configured, keeping media"; exit 0; fi
          echo "Stripping media from dist/"
          find dist -type d -name "media" -exec rm -rf {} + 2>/dev/null || true
          echo "Media stripped"

      # ── 9. Upload search index to R2 ────────
      - name: Upload search index to R2
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then echo "No R2_ACCESS_KEY, skipping"; exit 0; fi
          echo "Uploading search index..."
          rclone copy dist/data/search-index.json "r2:${R2_BUCKET}/site-data/" --verbose
          rclone copy dist/data/posts.json "r2:${R2_BUCKET}/site-data/" --verbose
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # Deploy handled by deploy-cf workflow (avoids concurrent deploy conflicts)
      - name: Deploy note
        run: echo "Deploy handled by Deploy to Cloudflare Pages workflow"

      # ── 10. Cleanup temp media ──────────────
      - name: Cleanup temporary media files
        if: always()
        run: |
          find content/posts/ -name "*.jpg" -delete
          find content/posts/ -name "*.jpeg" -delete
          find content/posts/ -name "*.png" -delete
          find content/posts/ -name "*.webp" -delete
          find content/posts/ -name "*.mp4" -delete
          find content/posts/ -name "*.mp3" -delete
          find content/posts/ -name "*.m3u8" -delete
          find content/posts/ -name "*.ts" -delete
          echo "Temporary media cleaned"
