name: Verify Mosaic

# Deduplicated on purpose: pull requests and non-main branches only. A main push
# is handled by pipeline.yml / infrastructure.yml, so this workflow never burns
# a second full browser run on the same commit.
on:
  pull_request:
  push:
    branches-ignore: ['main']

permissions:
  contents: read

concurrency:
  # A branch push and its pull_request event must share one group, otherwise
  # the same commit runs the full browser suite twice.
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix worker
      - name: Offline checks
        run: npm run check && npm run lint && npm run format:check
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Media integration (fixtures and in-memory storage)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm run test:media
      - name: Browser and accessibility regression
        run: |
          npm run build
          npm run test:e2e:local
          npm run test:admin:local
