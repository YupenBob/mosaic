name: Mosaic Preview

# Dispatched by the Worker when a private preview (or its rebuild) is requested.
# One preview per id; a newer run cancels the previous one.
on:
  workflow_dispatch:
    inputs:
      preview_id:
        description: Preview id
        required: true
        type: string
      draft_id:
        description: Cloud draft id
        required: true
        type: string
      api_base:
        description: Worker API origin
        required: true
        type: string
      timeout_minutes:
        description: Preview job timeout
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: mosaic-preview-${{ inputs.preview_id }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ${{ vars.MOSAIC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '30') }}
    # Non-secret inputs only; credentials are scoped to the steps that call the
    # Worker or R2, never to `npm ci` or the site build.
    env:
      API_BASE: ${{ inputs.api_base }}
      PREVIEW_ID: ${{ inputs.preview_id }}
      DRAFT_ID: ${{ inputs.draft_id }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      SITE_BRANCH: ${{ vars.SITE_BRANCH }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Read deployment configuration
        run: node scripts/deployment-env.mjs
      - name: Fetch published media manifest
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview/fetch-manifest.mjs
      - name: Fetch cloud draft
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          node scripts/preview/call.mjs draft
          node scripts/preview/write-draft.mjs "$RUNNER_TEMP/draft.json"
      - name: Generate preview
        run: npm run build
      - name: Upload preview to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview/upload.mjs dist
      # One terminal report for every outcome (success, failure, cancel).
      - name: Report preview result
        if: always()
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          PREVIEW_OK: ${{ job.status == 'success' && 'true' || 'false' }}
          PREVIEW_ERROR: ${{ job.status != 'success' && format('Preview workflow {0}', job.status) || '' }}
        run: node scripts/preview/call.mjs done || true
      # Failed/cancelled previews must not leave partially uploaded objects
      # behind: remove previews/<id>/ before the next attempt rebuilds it.
      - name: Clean up unfinished preview
        if: cancelled() || failure()
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview/cleanup.mjs || true
