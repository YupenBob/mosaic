name = "mosaic-api"
main = "src/index.js"
compatibility_date = "2024-04-01"

# R2 Bucket binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mosaic-media"

# Durable Object for race-free view/like/dwell counters
[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsDurableObject"]

# Environment variables
[vars]
GITHUB_REPO = "YupenBob/mosaic"
R2_BUCKET = "mosaic-media"

# Secrets (set via `wrangler secret put`)
# ADMIN_PASSWORD
# JWT_SECRET
# GITHUB_TOKEN
# R2_ACCESS_KEY
# R2_SECRET_KEY
# CF_ACCOUNT_ID

[observability]
enabled = true
head_sampling_rate = 1
