name = "mosaic-api"
main = "src/index.js"
compatibility_date = "2024-04-01"

# R2 Bucket binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mosaic-media"

# Durable Object for race-free view/like/dwell counters
[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsDurableObject"]

[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobsDurableObject"

[[migrations]]
tag = "v2-media-jobs"
new_sqlite_classes = ["JobsDurableObject"]

# Environment variables
[vars]
GITHUB_REPO = "YupenBob/mosaic"
R2_BUCKET = "mosaic-media"
ALLOWED_ORIGINS = "https://mosaic-admin.xsanye.cn"
SITE_BRANCH = "main"
MEDIA_MANIFEST_KEY = "site-data/media-manifest.json"
REQUIRE_MEDIA_MIGRATION = "true"

# Secrets (set via `wrangler secret put`)
# ADMIN_PASSWORD
# JWT_SECRET
# GITHUB_TOKEN
# R2_ACCESS_KEY
# R2_SECRET_KEY
# CF_ACCOUNT_ID
# PIPELINE_SECRET

[observability]
enabled = true
head_sampling_rate = 1
