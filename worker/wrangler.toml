name = "mosaic-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

# R2 Bucket binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mosaic-media"

# Environment variables
[vars]
GITHUB_REPO = "YupenBob/mosaic"
R2_BUCKET = "mosaic-media"

# Secrets (set via `wrangler secret put`)
# ADMIN_PASSWORD
# JWT_SECRET
# GITHUB_TOKEN
# R2_ACCESS_KEY
# R2_SECRET_KEY
# CF_ACCOUNT_ID

[observability]
enabled = true
head_sampling_rate = 1
