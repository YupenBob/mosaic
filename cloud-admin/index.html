<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%234361ee' opacity='.9'/%3E%3Crect x='26' y='2' width='20' height='20' rx='5' fill='%234361ee' opacity='.65'/%3E%3Crect x='2' y='26' width='20' height='20' rx='5' fill='%234361ee' opacity='.4'/%3E%3Crect x='26' y='26' width='20' height='20' rx='5' fill='%234361ee' opacity='.75'/%3E%3C/svg%3E"
    />
    <title>Mosaic Cloud Admin</title>
    <script>
      // Theme bootstrap — apply resolved theme before first paint to avoid flash.
      (function () {
        try {
          var pref = localStorage.getItem('mosaic_admin_theme') || 'auto';
          window.__MOSAIC_THEME_PREF__ = pref;
          var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="remixicon.css?v=1" />
    <link rel="stylesheet" href="css/admin.css?v=1" />
    <script>
      // Config injected at build time
      window.__API_BASE__ = '/api';
      window.__MEDIA_BASE__ = 'https://mosaic-media.xsanye.cn';
    </script>
  </head>
  <body class="admin-body">
    <!-- Skip link — first focusable element for keyboard users -->
    <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">跳到主要内容</a>

    <!-- Loading — shown during auth check, prevents flash -->
    <div id="loading-screen" class="loading-screen" role="status" aria-label="Loading">
      <i class="ri-loader-4-line loading-spinner"></i>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="login-overlay" style="display: none">
      <div class="login-box">
        <div class="login-logo" aria-hidden="true">
          <svg width="52" height="52" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.9" />
            <rect x="26" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.65" />
            <rect x="2" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.4" />
            <rect x="26" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.75" />
          </svg>
        </div>
        <h1 data-i18n="login.title">Mosaic 管理后台</h1>
        <p class="login-subtitle" data-i18n="login.subtitle">请输入管理员密码</p>
        <div class="login-password-wrap">
          <input
            type="password"
            id="login-password"
            class="input"
            data-i18n-placeholder="login.placeholder"
            placeholder="密码"
            autocomplete="current-password"
            onkeydown="if (event.key === 'Enter') window.mosaicLogin();"
          />
          <button type="button" class="login-eye" id="login-eye" aria-label="显示密码" onclick="toggleLoginPassword()">
            <i class="ri-eye-line"></i>
          </button>
        </div>
        <button id="login-btn" class="btn btn-primary btn-block" onclick="window.mosaicLogin()" data-i18n="login.btn">
          登录
        </button>
        <p id="login-error" class="login-error" role="alert" style="display: none"></p>
      </div>
    </div>

    <!-- Main App (hidden until login) -->
    <div id="app" style="display: none; flex-direction: column">
      <!-- Topbar -->
      <header class="topbar">
        <button
          class="icon-btn sidebar-toggle"
          id="sidebar-toggle"
          aria-label="打开导航"
          data-i18n-aria="a11y.openNav"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <i class="ri-menu-line" aria-hidden="true"></i>
        </button>
        <div class="topbar-breadcrumb" id="topbar-breadcrumb" title="">
          <a href="#dashboard" class="topbar-brand" data-i18n="nav.home">首页</a>
          <i class="ri-arrow-right-s-line topbar-sep" aria-hidden="true"></i>
          <strong id="topbar-page">仪表盘</strong>
        </div>

        <div class="global-search" id="global-search">
          <i class="ri-search-line global-search-icon" aria-hidden="true"></i>
          <input
            id="global-search-input"
            data-i18n-placeholder="common.searchPlaceholder"
            placeholder="搜索文章或命令…"
            autocomplete="off"
            data-i18n-aria="common.searchPlaceholder"
            aria-label="全局搜索"
          />
          <kbd class="global-search-kbd">Ctrl K</kbd>
        </div>

        <div class="topbar-actions">
          <button type="button" class="app-status" id="app-status" hidden>
            <span class="app-status-dot" aria-hidden="true"></span>
            <span class="app-status-text" id="app-status-text" role="status" aria-live="polite"></span>
          </button>
          <span id="topbar-build-dot" class="status-dot" title=""></span>
          <button
            class="icon-btn"
            id="topbar-build-btn"
            data-i18n-title="build.title"
            data-i18n-aria="build.title"
            title="上线"
            aria-label="上线"
          >
            <i class="ri-play-circle-line" aria-hidden="true"></i>
          </button>
          <button type="button" class="btn btn-primary btn-sm topbar-create" id="topbar-create">
            <i class="ri-add-line" aria-hidden="true"></i>
            <span data-i18n="common.newPost">写文章</span>
          </button>
          <div class="account-menu-wrap">
            <button
              type="button"
              class="account-btn"
              id="account-btn"
              aria-haspopup="menu"
              aria-expanded="false"
              data-i18n-aria="account.menu"
              aria-label="账户菜单"
            >
              <span class="account-avatar" id="account-avatar">M</span>
            </button>
            <div class="account-menu" id="account-menu" role="menu" hidden>
              <div class="account-menu-head">
                <span class="account-menu-name">Mosaic</span>
                <span class="account-menu-role" data-i18n="account.role">管理员</span>
              </div>
              <a
                class="account-item"
                id="account-site-link"
                role="menuitem"
                href="#"
                target="_blank"
                rel="noopener"
                hidden
              >
                <i class="ri-external-link-line" aria-hidden="true"></i>
                <span data-i18n="common.viewSite">访问网站</span>
              </a>
              <div class="account-section" role="group" aria-labelledby="account-theme-label">
                <span class="account-section-label" id="account-theme-label" data-i18n="config.adminTheme">主题</span>
                <div class="account-segmented" id="account-theme-options">
                  <button type="button" role="menuitemradio" data-theme-pref="auto" data-i18n="account.themeAuto">
                    自动
                  </button>
                  <button type="button" role="menuitemradio" data-theme-pref="light" data-i18n="config.themeLight">
                    浅色
                  </button>
                  <button type="button" role="menuitemradio" data-theme-pref="dark" data-i18n="config.themeDark">
                    深色
                  </button>
                </div>
              </div>
              <div class="account-section" role="group" aria-labelledby="account-lang-label">
                <span class="account-section-label" id="account-lang-label" data-i18n="config.adminLang">语言</span>
                <div class="account-segmented" id="account-lang-options">
                  <button type="button" role="menuitemradio" data-lang="zh-CN">中文</button>
                  <button type="button" role="menuitemradio" data-lang="en">English</button>
                </div>
              </div>
              <button type="button" class="account-item account-signout" id="account-signout" role="menuitem">
                <i class="ri-logout-box-line" aria-hidden="true"></i>
                <span data-i18n="nav.signOut">退出登录</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <div class="app-body">
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-logo">
            <svg
              width="22"
              height="22"
              viewBox="0 0 48 48"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              style="flex-shrink: 0"
              aria-hidden="true"
            >
              <rect x="2" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.9" />
              <rect x="26" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.65" />
              <rect x="2" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.4" />
              <rect x="26" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.75" />
            </svg>
            <span class="sidebar-logo-text">Mosaic Cloud</span>
          </div>
          <nav class="sidebar-nav" id="sidebar-nav" data-i18n-aria="a11y.mainNav" aria-label="主导航">
            <div class="nav-group">
              <div class="nav-group-label" data-i18n="nav.groupContent">内容</div>
              <a
                href="#dashboard"
                class="nav-item"
                data-page="dashboard"
                aria-label="概览"
                data-i18n-aria="nav.dashboard"
                ><i class="ri-dashboard-line"></i> <span data-i18n="nav.dashboard">概览</span></a
              >
              <a href="#posts" class="nav-item" data-page="posts" aria-label="文章" data-i18n-aria="nav.posts"
                ><i class="ri-article-line"></i> <span data-i18n="nav.posts">文章</span></a
              >
              <a href="#editor" class="nav-item" data-page="editor" aria-label="写文章" data-i18n-aria="nav.editor"
                ><i class="ri-edit-line"></i> <span data-i18n="nav.editor">写文章</span></a
              >
              <a href="#library" class="nav-item" data-page="library" aria-label="素材库" data-i18n-aria="nav.library"
                ><i class="ri-hard-drive-3-line"></i> <span data-i18n="nav.library">素材库</span></a
              >
              <a
                href="#taxonomy"
                class="nav-item"
                data-page="taxonomy"
                aria-label="分类与标签"
                data-i18n-aria="nav.taxonomy"
                ><i class="ri-price-tag-3-line"></i> <span data-i18n="nav.taxonomy">分类与标签</span></a
              >
            </div>
            <div class="nav-group">
              <div class="nav-group-label" data-i18n="nav.groupSite">站点</div>
              <a href="#build" class="nav-item" data-page="build" aria-label="上线" data-i18n-aria="nav.build"
                ><i class="ri-rocket-line"></i> <span data-i18n="nav.build">上线</span
                ><span class="nav-badge" id="nav-build-badge" style="display: none"></span
              ></a>
              <a href="#config" class="nav-item" data-page="config" aria-label="设置" data-i18n-aria="nav.config"
                ><i class="ri-settings-line"></i> <span data-i18n="nav.config">设置</span></a
              >
            </div>
            <div class="nav-group">
              <div class="nav-group-label" data-i18n="nav.groupSystem">系统</div>
              <a href="#tasks" class="nav-item" data-page="tasks" aria-label="任务中心" data-i18n-aria="nav.tasks"
                ><i class="ri-list-check-2"></i> <span data-i18n="nav.tasks">任务中心</span
                ><span class="nav-badge" id="nav-task-badge" style="display: none"></span
              ></a>
              <a href="#cleanup" class="nav-item" data-page="cleanup" aria-label="清理" data-i18n-aria="nav.cleanup"
                ><i class="ri-broom-line"></i> <span data-i18n="nav.cleanup">清理</span></a
              >
            </div>
            <div class="nav-group nav-group-bottom">
              <a
                href="#"
                id="logout-btn"
                class="nav-item"
                aria-label="退出登录"
                data-i18n-aria="nav.signOut"
                onclick="
                  event.preventDefault();
                  window.mosaicLogout();
                "
                ><i class="ri-logout-box-line"></i> <span data-i18n="nav.signOut">退出登录</span></a
              >
            </div>
          </nav>
        </aside>

        <main class="main-content" id="main-content" tabindex="-1">
          <!-- Pages will be rendered here dynamically -->
        </main>
      </div>
    </div>

    <script type="module" src="js/admin.js?v=1"></script>
  </body>
</html>
