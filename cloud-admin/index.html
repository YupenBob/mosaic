<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%234361ee' opacity='.9'/%3E%3Crect x='26' y='2' width='20' height='20' rx='5' fill='%234361ee' opacity='.65'/%3E%3Crect x='2' y='26' width='20' height='20' rx='5' fill='%234361ee' opacity='.4'/%3E%3Crect x='26' y='26' width='20' height='20' rx='5' fill='%234361ee' opacity='.75'/%3E%3C/svg%3E" />
  <title>Mosaic Cloud Admin</title>
  <link rel="stylesheet" href="remixicon.css" />
  <script src="js/vendor/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/admin.css" />
  <script>
    // Config injected at build time
    window.__API_BASE__ = '/api';
    window.__MEDIA_BASE__ = 'https://mosaic-media.xsanye.cn';
  </script>
</head>
<body class="admin-body">

<!-- Loading — shown during auth check, prevents flash -->
<div id="loading-screen" style="position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:var(--color-bg)">
  <i class="ri-loader-4-line" style="font-size:32px;color:var(--color-accent);animation:spin 1s linear infinite"></i>
</div>

<!-- Login Screen -->
<div id="login-screen" class="login-overlay" style="display:none">
  <div class="login-box">
    <div style="margin-bottom:16px">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.9"/>
          <rect x="26" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.65"/>
          <rect x="2" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.4"/>
          <rect x="26" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.75"/>
        </svg>
      </div>
      <h1 data-i18n="login.title">Mosaic 管理后台</h1>
    <p data-i18n="login.subtitle">请输入管理员密码</p>
    <input type="password" id="login-password" data-i18n-placeholder="login.placeholder" placeholder="密码" autofocus onkeydown="if(event.key==='Enter')window.mosaicLogin()" />
    <button id="login-btn" class="btn-primary" onclick="window.mosaicLogin()" data-i18n="login.btn">登录</button>
    <p id="login-error" style="color:#e74c3c;font-size:13px;display:none;margin-top:8px"></p>
  </div>
</div>

<!-- Main App (hidden until login) -->
<div id="app" style="display:none;flex-direction:column">
  <!-- Dirty banner — full width above sidebar+main -->
  <div id="dirty-banner" style="display:none;background:#f0a500;color:#fff;padding:8px 24px;font-size:13px;cursor:pointer;text-align:center;flex-shrink:0" onclick="location.hash='build'">
    <i class="ri-error-warning-line"></i> 内容已修改，需要构建才能在网站生效。点击此处前往构建 <i class="ri-arrow-right-line"></i>
  </div>

  <div style="display:flex;flex:1;min-height:0">
    <aside class="sidebar">
      <div class="sidebar-logo">
          <svg width="22" height="22" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
            <rect x="2" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.9"/>
            <rect x="26" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.65"/>
            <rect x="2" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.4"/>
            <rect x="26" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.75"/>
          </svg>
          Mosaic Cloud
        </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#dashboard" class="nav-item" data-page="dashboard"><i class="ri-dashboard-line"></i> <span data-i18n="nav.dashboard">仪表盘</span></a>
        <a href="#posts" class="nav-item" data-page="posts"><i class="ri-article-line"></i> <span data-i18n="nav.posts">文章</span></a>
        <a href="#editor" class="nav-item" data-page="editor"><i class="ri-edit-line"></i> <span data-i18n="nav.editor">编辑器</span></a>
        <a href="#build" class="nav-item" data-page="build"><i class="ri-tools-line"></i> <span data-i18n="nav.build">构建与部署</span></a>
        <div class="sidebar-divider"></div>
        <a href="#config" class="nav-item" data-page="config"><i class="ri-settings-line"></i> <span data-i18n="nav.config">站点设置</span></a>
        <a href="#taxonomy" class="nav-item" data-page="taxonomy"><i class="ri-price-tag-3-line"></i> <span data-i18n="nav.taxonomy">分类与标签</span></a>
        <a href="#cleanup" class="nav-item" data-page="cleanup"><i class="ri-delete-bin-line"></i> <span data-i18n="nav.cleanup">清理</span></a>
        <div class="sidebar-divider"></div>
        <a href="#" id="logout-btn" class="nav-item" onclick="event.preventDefault();window.mosaicLogout()"><i class="ri-logout-box-line"></i> <span data-i18n="nav.signOut">退出登录</span></a>
      </nav>
    </aside>

    <main class="main-content" id="main-content">
      <!-- Pages will be rendered here dynamically -->
    </main>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
