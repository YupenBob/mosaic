<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%234361ee' opacity='.9'/%3E%3Crect x='26' y='2' width='20' height='20' rx='5' fill='%234361ee' opacity='.65'/%3E%3Crect x='2' y='26' width='20' height='20' rx='5' fill='%234361ee' opacity='.4'/%3E%3Crect x='26' y='26' width='20' height='20' rx='5' fill='%234361ee' opacity='.75'/%3E%3C/svg%3E" />
  <title>Mosaic Cloud Admin</title>
  <script>
    // Theme bootstrap — apply resolved theme before first paint to avoid flash.
    (function () {
      try {
        var pref = localStorage.getItem('mosaic_admin_theme') || 'auto';
        window.__MOSAIC_THEME_PREF__ = pref;
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="remixicon.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script>
    // Config injected at build time
    window.__API_BASE__ = '/api';
    window.__MEDIA_BASE__ = 'https://mosaic-media.xsanye.cn';
  </script>
</head>
<body class="admin-body">

<!-- Loading — shown during auth check, prevents flash -->
<div id="loading-screen" class="loading-screen" role="status" aria-label="Loading">
  <i class="ri-loader-4-line loading-spinner"></i>
</div>

<!-- Login Screen -->
<div id="login-screen" class="login-overlay" style="display:none">
  <div class="login-box">
    <div class="login-logo" aria-hidden="true">
      <svg width="52" height="52" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.9"/>
        <rect x="26" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.65"/>
        <rect x="2" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.4"/>
        <rect x="26" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.75"/>
      </svg>
    </div>
    <h1 data-i18n="login.title">Mosaic 管理后台</h1>
    <p class="login-subtitle" data-i18n="login.subtitle">请输入管理员密码</p>
    <div class="login-password-wrap">
      <input type="password" id="login-password" class="input" data-i18n-placeholder="login.placeholder" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')window.mosaicLogin()" />
      <button type="button" class="login-eye" id="login-eye" aria-label="显示密码" onclick="toggleLoginPassword()"><i class="ri-eye-line"></i></button>
    </div>
    <button id="login-btn" class="btn btn-primary btn-block" onclick="window.mosaicLogin()" data-i18n="login.btn">登录</button>
    <p id="login-error" class="login-error" role="alert" style="display:none"></p>
  </div>
</div>

<!-- Main App (hidden until login) -->
<div id="app" style="display:none;flex-direction:column">
  <!-- Dirty banner — full width above topbar -->
  <div id="dirty-banner" class="dirty-banner" style="display:none" role="status">
    <i class="ri-error-warning-line"></i>
    <span id="dirty-banner-text"></span>
    <button class="btn btn-secondary btn-sm dirty-banner-cta" onclick="location.hash='build'">
      <i class="ri-tools-line"></i> <span data-i18n="dirty.goBuild">前往构建</span>
    </button>
  </div>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-breadcrumb" id="topbar-breadcrumb" title="">
      <a href="#dashboard" class="topbar-brand" data-i18n="nav.home">首页</a>
      <i class="ri-arrow-right-s-line topbar-sep" aria-hidden="true"></i>
      <strong id="topbar-page">仪表盘</strong>
    </div>

    <div class="global-search" id="global-search">
      <i class="ri-search-line global-search-icon" aria-hidden="true"></i>
      <input id="global-search-input" data-i18n-placeholder="common.searchPlaceholder" placeholder="搜索文章或命令…" autocomplete="off" aria-label="全局搜索" />
      <kbd class="global-search-kbd">Ctrl K</kbd>
    </div>

    <div class="topbar-actions">
      <span id="topbar-build-dot" class="status-dot" title=""></span>
      <button class="icon-btn" id="topbar-build-btn" title="构建并部署" aria-label="构建并部署">
        <i class="ri-play-circle-line"></i>
      </button>
      <button class="icon-btn" id="topbar-theme-btn" title="切换主题" aria-label="切换主题"></button>
      <select id="topbar-lang" class="lang-select" title="界面语言" aria-label="界面语言">
        <option value="zh-CN">中文</option>
        <option value="en">EN</option>
      </select>
      <a class="icon-btn" id="topbar-site-btn" target="_blank" rel="noopener" title="访问网站" aria-label="访问网站">
        <i class="ri-external-link-line"></i>
      </a>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg width="22" height="22" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.9"/>
          <rect x="26" y="2" width="20" height="20" rx="5" fill="#4361ee" opacity="0.65"/>
          <rect x="2" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.4"/>
          <rect x="26" y="26" width="20" height="20" rx="5" fill="#4361ee" opacity="0.75"/>
        </svg>
        <span class="sidebar-logo-text">Mosaic Cloud</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="主导航">
        <div class="nav-group">
          <div class="nav-group-label" data-i18n="nav.groupContent">内容</div>
          <a href="#dashboard" class="nav-item" data-page="dashboard"><i class="ri-dashboard-line"></i> <span data-i18n="nav.dashboard">仪表盘</span></a>
          <a href="#posts" class="nav-item" data-page="posts"><i class="ri-article-line"></i> <span data-i18n="nav.posts">文章</span></a>
          <a href="#editor" class="nav-item" data-page="editor"><i class="ri-edit-line"></i> <span data-i18n="nav.editor">编辑器</span></a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label" data-i18n="nav.groupSite">站点</div>
          <a href="#build" class="nav-item" data-page="build"><i class="ri-tools-line"></i> <span data-i18n="nav.build">构建与部署</span><span class="nav-badge" id="nav-build-badge" style="display:none"></span></a>
          <a href="#config" class="nav-item" data-page="config"><i class="ri-settings-line"></i> <span data-i18n="nav.config">站点设置</span></a>
          <a href="#taxonomy" class="nav-item" data-page="taxonomy"><i class="ri-price-tag-3-line"></i> <span data-i18n="nav.taxonomy">分类与标签</span></a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label" data-i18n="nav.groupData">数据</div>
          <a href="#trash" class="nav-item" data-page="trash"><i class="ri-delete-bin-6-line"></i> <span data-i18n="nav.trash">回收站</span></a>
          <a href="#cleanup" class="nav-item" data-page="cleanup"><i class="ri-broom-line"></i> <span data-i18n="nav.cleanup">清理</span></a>
        </div>
        <div class="nav-group nav-group-bottom">
          <a href="#" id="logout-btn" class="nav-item" onclick="event.preventDefault();window.mosaicLogout()"><i class="ri-logout-box-line"></i> <span data-i18n="nav.signOut">退出登录</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content" id="main-content" tabindex="-1">
      <!-- Pages will be rendered here dynamically -->
    </main>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
